<div class="login-page">
  <!-- Background Logistics Floating Elements -->
  <div class="login-bg">
    <div class="bg-circle bg-circle-1"></div>
    <div class="bg-circle bg-circle-2"></div>
    <div class="bg-circle bg-circle-3"></div>

    <!-- Logistics Floating Icons -->
    <div class="floating-icon icon-truck">
      <span class="material-icons-round">local_shipping</span>
    </div>
    <div class="floating-icon icon-package">
      <span class="material-icons-round">inventory_2</span>
    </div>
    <div class="floating-icon icon-route">
      <span class="material-icons-round">alt_route</span>
    </div>
    <div class="floating-icon icon-speed">
      <span class="material-icons-round">speed</span>
    </div>
  </div>

  <div class="login-container animate-fade-in">
    <!-- Logistics Top Tag -->
    <div class="logistics-top-tag">

      <span>الخدمات اللوجستية المتكاملة</span>
    </div>

    <!-- Logo & Title -->
    <div class="login-header">
      <img src="logo-ksclc.png" alt="شركة كمال بن خلف السلمي للخدمات اللوجستية" class="login-logo-img">
      <h1 class="login-title">شركة كمال السلمي</h1>
      <p class="login-subtitle">نظام الإدارة والخدمات اللوجستية</p>
    </div>

    <!-- Logistics Feature Badges -->
    <div class="logistics-features">
      <span class="feat-chip"><span class="material-icons-round">local_shipping</span> توصيل سريع</span>
      <span class="feat-chip"><span class="material-icons-round">inventory_2</span> إدارة </span>
      <span class="feat-chip"><span class="material-icons-round">verified</span> أمان واحترافية</span>
    </div>

    <!-- Login Form -->
    <form class="login-form" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label class="form-label" for="username">
          <span class="material-icons-round label-icon">person</span>
          اسم المستخدم
        </label>
        <input id="username" class="form-input" type="text" [(ngModel)]="username" name="username"
          placeholder="أدخل اسم المستخدم" autocomplete="username" [class.error]="errorMessage">
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          <span class="material-icons-round label-icon">lock</span>
          كلمة المرور
        </label>
        <input id="password" class="form-input" type="password" [(ngModel)]="password" name="password"
          placeholder="أدخل كلمة المرور" autocomplete="current-password" [class.error]="errorMessage">
      </div>

      <!-- Error message -->
      <div class="error-banner" *ngIf="errorMessage">
        <span class="material-icons-round">error</span>
        {{ errorMessage }}
      </div>

      <!-- Submit button -->
      <button type="submit" class="btn btn-login" [disabled]="isLoading">
        <span class="spinner spinner-sm" *ngIf="isLoading"></span>
        <span *ngIf="!isLoading">تسجيل الدخول</span>
        <span class="material-icons-round" *ngIf="!isLoading">login</span>
      </button>
    </form>

    <div class="login-footer">
      <p>© {{ currentYear }} شركة كمال بن خلف السلمي للخدمات اللوجستية — جميع الحقوق محفوظة</p>
    </div>
  </div>
</div>
