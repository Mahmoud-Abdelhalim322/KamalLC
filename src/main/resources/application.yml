# =============================================
# Kamal Food Captain Management System
# =============================================

server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: kamalres

  # ---- DataSource ----
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kslsc_db}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:7ooda123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Riyadh

  # ---- Static Resources (Angular) ----
  web:
    resources:
      static-locations: classpath:/static/browser/

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"

  # ---- Servlet (multipart upload) ----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ---- JWT Configuration ----
app:
  jwt:
    secret: ${JWT_SECRET:KamalFoodDevOnlyKey2026AtLeast32BytesLongForHMACSHA256!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24 hours (use env var to override)

  # ---- File Storage ----
  file-storage:
    base-path: ${FILE_STORAGE_PATH:./uploads}

  # ---- Captain Code Generation ----
  # NOTE: employee-prefix is a prefix of freelance-prefix; the generator excludes
  # freelance codes when numbering employees.
  captain-code:
    employee-prefix: KSC
    freelance-prefix: KSCFL

  # ---- Default Admin (used if env vars not set) ----
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@12345}

  # ---- Platform Admin (SaaS Super Admin) ----
  platform-admin:
    username: ${PLATFORM_ADMIN_USERNAME:kslsc}
    password: ${PLATFORM_ADMIN_PASSWORD:admin@kslsc}

  # ---- CORS ----
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8082}

  # ---- Rate Limiting ----
  rate-limit:
    login:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window-seconds: ${LOGIN_WINDOW_SECONDS:300}

# ---- Logging ----
logging:
  level:
    com.kamal.lc: ${LOG_LEVEL_APP:DEBUG}
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
