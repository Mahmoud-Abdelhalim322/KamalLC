# =============================================
# Kamal Food Captain Management System
# =============================================

server:
  port: 8082

spring:
  application:
    name: kamalres

  # ---- DataSource ----
  datasource:
    url: jdbc:postgresql://localhost:5432/kslsc_db
    username: postgres
    password: 7ooda123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Riyadh

  # ---- Static Resources (Angular) ----
  web:
    resources:
      static-locations: classpath:/static/browser/

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    ignore-migration-patterns: "*:missing"

  # ---- Servlet (multipart upload) ----
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

# ---- JWT Configuration ----
app:
  jwt:
    secret: KamalFoodSecretKey2026VeryLongSecureKeyForJWTTokenGeneration!@#$%
    expiration-ms: 86400000  # 24 hours

  # ---- File Storage ----
  file-storage:
    base-path: ./uploads

  # ---- Captain Code Generation ----
  # NOTE: employee-prefix is a prefix of freelance-prefix; the generator excludes
  # freelance codes when numbering employees.
  captain-code:
    employee-prefix: KSC
    freelance-prefix: KSCFL

  # ---- Default Admin (used if env vars not set) ----
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:Admin@12345}

# ---- Logging ----
logging:
  level:
    com.kamal.lc: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
